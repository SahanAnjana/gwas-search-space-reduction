[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clear_a"
version = "0.1.0"
description = "Calibrated, LD-aware, Explainable Reduction for Association (CLEAR-A) — ML-based SNP search space reduction for GWAS, validated on openSNP."
requires-python = ">=3.10"
authors = [
    { name = "258421E Nuwan Sanjeewa" },
    { name = "258423L Sathsara Weerakkodi" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "torch>=2.2",
    "shap>=0.44",
    "captum>=0.7",
    "knockpy>=1.3",
    "bed-reader>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
]
# cyvcf2 needs htslib which is painful on Windows. Required only for
# `clear_a.impute.load_imputed_dosages`; on Windows install via WSL or use
# `pip install pysam cyvcf2 --no-binary cyvcf2` after installing htslib.
vcf = [
    "cyvcf2>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
